<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eae1d0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1814" media="(prefers-color-scheme: dark)">
<meta name="description" content="Alok's Diary: one ruled page for every day, with Google Calendar events, synced across phone and computer.">
<title>Alok's Diary</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Kalam:wght@400;700&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: a warm desk; one ivory diary page per day. On wide screens a left rail holds the month calendar, upcoming events and search. */
:root{
  --desk:#eae1d0; --sheet:#f4eddf; --ink:#29251f; --muted:#7b7262; --line:#d6cab3; --accent:#b94c45; --ok:#4f6b3a;
  --ivory:#fffdf6; --rule:#c9d9e5; --marg:#e58a83; --shadow:rgba(60,45,20,.28);
  --k-bday:#b8426b; --k-anniv:#b5473a; --k-hol:#b07a12; --k-moon:#5a6aa8; --k-meet:#2f7a7a; --k-travel:#4a6fa5; --k-pay:#5e7a3c; --k-task:#7d4a8f; --k-ev:#6d5c45;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --L:32px; --fs:19px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#1b1814; --sheet:#24201a; --ink:#ece4d5; --muted:#a69a86; --line:#3b342b; --accent:#e0716a; --ok:#9cbc7f;
  --ivory:#29251f; --rule:#3a4250; --marg:#a8564f; --shadow:rgba(0,0,0,.55);
  --k-bday:#e58fb0; --k-anniv:#e48d80; --k-hol:#e0b04a; --k-moon:#9fb0ea; --k-meet:#7cc7c4; --k-travel:#94b4e0; --k-pay:#a9c98a; --k-task:#c79ad6; --k-ev:#c7b597;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#1b1814; --sheet:#24201a; --ink:#ece4d5; --muted:#a69a86; --line:#3b342b; --accent:#e0716a; --ok:#9cbc7f;
  --ivory:#29251f; --rule:#3a4250; --marg:#a8564f; --shadow:rgba(0,0,0,.55);
  --k-bday:#e58fb0; --k-anniv:#e48d80; --k-hol:#e0b04a; --k-moon:#9fb0ea; --k-meet:#7cc7c4; --k-travel:#94b4e0; --k-pay:#a9c98a; --k-task:#c79ad6; --k-ev:#c7b597;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior-y:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--desk);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.45;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html.locked body{overflow:hidden}

/* shell */
.shell{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
.side{display:none}
main#app{min-width:0;width:100%;max-width:780px;margin:0 auto}
@media (min-width:1000px){
  .shell{grid-template-columns:320px minmax(0,1fr);gap:32px}
  :root{--L:36px;--fs:21px}
  .dpaper{padding:26px 28px 26px 8px}
  .ddt{font-size:40px}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(14px + env(safe-area-inset-top,0px));max-height:calc(100vh - 28px);overflow-y:auto;padding:4px 2px 12px}
  main#app{margin:0;max-width:none}
  .only-narrow{display:none!important}
}

/* buttons, bars */
.btn{background:var(--ink);color:var(--desk);border:0;border-radius:10px;padding:8px 14px;font-family:var(--sans);font-size:14px;font-weight:600;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.warn{background:var(--accent);color:var(--ivory)}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{all:unset;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--muted);text-decoration:underline}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;color:var(--ink);flex:0 0 auto}
.search{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 12px}
.search .lbl{font-family:var(--sans);font-size:12px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;padding:7px 0}
.search input:focus{outline:none}
.note{font-size:13px;color:var(--muted);font-family:var(--sans);margin:0}
.empty{color:var(--muted);font-style:italic;padding:14px 0;margin:0}
.eyebrow{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.credit{text-align:center;font-family:var(--serif);font-style:italic;font-size:15px;letter-spacing:.04em;color:var(--muted);margin:20px 0 0}
.credit::before,.credit::after{content:"";display:inline-block;width:28px;height:1px;background:var(--muted);opacity:.5;vertical-align:middle;margin:0 10px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;min-width:0}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;flex:0 0 auto}
.topr{display:flex;align-items:center;gap:10px}
.now{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12px;color:var(--muted)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.synced::before{background:var(--ok)} .sync.saving::before{background:#c9a24a} .sync.offline::before,.sync.error::before{background:var(--accent)}
@media (max-width:520px){.now .ndate{display:none}.topr .sync{font-size:0;gap:0}.brand{white-space:nowrap}
  .wish{padding:10px 12px;gap:6px}.wish p{font-size:15.5px}.devs,.dcarry{margin-left:56px}}

/* flip clock */
.clock{display:inline-flex;align-items:center;gap:2px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.fd{position:relative;display:inline-grid;place-items:center;width:1.05em;height:1.45em;border-radius:5px;background:var(--ink);color:var(--desk);font-size:14px;font-weight:600;line-height:1;overflow:hidden}
.fd::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:color-mix(in srgb,var(--desk) 30%,transparent)}
.fd b{display:block;font-weight:600}
.fd.flip b{animation:flip .38s cubic-bezier(.3,.7,.4,1)}
@keyframes flip{0%{transform:rotateX(90deg);opacity:.2}100%{transform:rotateX(0);opacity:1}}
.csep{font-weight:700;color:var(--ink);font-size:14px;padding:0 1px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
.ampm{font-size:11px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:.04em}

/* side rail */
.side-brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.side-brand b{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.01em}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px}
.mini .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mini .mhead b{font-family:var(--serif);font-size:19px;font-weight:600}
.up{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.up li button{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:2px 8px;padding:7px 4px;border-radius:8px;width:100%;box-sizing:border-box}
.up li button:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.up li button:focus-visible{outline:2px solid var(--accent)}
.up .ic{grid-row:1/3;padding-top:2px}
.up .t{font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.up .w{font-family:var(--sans);font-size:11.5px;color:var(--muted)}
.keys{font-family:var(--sans);font-size:11.5px;color:var(--muted);line-height:1.8}
.keys kbd{font-family:var(--sans);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--ivory);color:var(--ink)}

/* month grid (popup and rail) */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-family:var(--sans)}
.wd{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:4px 0}
.day{all:unset;cursor:pointer;position:relative;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.day:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.day:focus-visible{outline:2px solid var(--accent)}
.day.out{visibility:hidden}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:600}
.day.sel{background:var(--ink);color:var(--desk);box-shadow:none}
.day .dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.day .dots i.e{background:var(--k-meet)}
.day .dots i.b{background:var(--k-bday)}
.day.sel .dots i{background:var(--desk)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dcal{position:fixed;inset:0;z-index:40;background:rgba(30,24,15,.32);display:flex;justify-content:center;align-items:flex-start;
  padding:calc(76px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.dcalcard{width:100%;max-width:340px;background:var(--ivory);border-radius:14px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);padding:14px 14px 12px}
.calfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:6px}
.arrow{width:36px;height:36px;border-radius:50%;border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);display:grid;place-items:center}
.arrow:hover{color:var(--ink)}

/* the page */
.dy{position:relative;display:flex;flex-direction:column;gap:14px}
.dpaper{position:relative;display:flex;flex-direction:column;min-height:calc(100vh - 150px);min-height:calc(100dvh - 150px);background:var(--ivory);border-radius:4px;box-shadow:0 1px 0 rgba(60,45,20,.06),0 12px 30px -14px var(--shadow);padding:20px 14px 24px 8px;overflow:hidden;touch-action:pan-y}
.dpaper::before{content:"";position:absolute;top:0;bottom:0;left:calc(8px + 44px + 8px);width:1.5px;background:var(--marg);opacity:.9}
.dhead{display:grid;grid-template-columns:44px 1fr auto;align-items:center;column-gap:16px}
.ddate{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;border-radius:6px}
.ddate:focus-visible{outline:2px solid var(--accent)}
.ddow{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ddt{font-size:clamp(24px,6.2vw,34px);font-weight:500;line-height:1.1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dcaret{font-size:13px;color:var(--muted);font-family:var(--sans)}
.dmeta{grid-column:2/4;margin:6px 0 0;font-family:var(--sans);font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--rule);border-radius:999px;padding:1px 9px;background:transparent;font-family:var(--sans);font-size:12px;color:var(--ink)}
.pill.future{border-color:var(--marg);color:var(--accent)}
button.pill{cursor:pointer}

/* calendar events on the page */
.devs{margin:14px 0 0 60px;display:flex;flex-direction:column;gap:6px}
.devs-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.dev{display:grid;grid-template-columns:22px auto 1fr;align-items:center;gap:8px;min-width:0}
.dev .tm{font-family:var(--sans);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dev a{color:var(--ink);text-decoration:none;font-size:17.5px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.dev a:hover{text-decoration:underline}
.dev .tag{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-left:6px;color:var(--k-hol);white-space:nowrap}
.ic{display:inline-grid;place-items:center;width:22px;height:22px;color:var(--k-ev)}
.ic svg{width:18px;height:18px}
.k-bday .ic{color:var(--k-bday)} .k-anniv .ic{color:var(--k-anniv)} .k-hol .ic{color:var(--k-hol)} .k-moon .ic{color:var(--k-moon)}
.k-meet .ic{color:var(--k-meet)} .k-travel .ic{color:var(--k-travel)} .k-pay .ic{color:var(--k-pay)} .k-task .ic{color:var(--k-task)}
.wishes{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.wish{position:relative;margin:0;display:grid!important;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:16px;border:1px solid color-mix(in srgb,var(--k-bday) 45%,transparent);background:color-mix(in srgb,var(--k-bday) 7%,transparent);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.wish.k-hol{border-color:color-mix(in srgb,var(--k-hol) 45%,transparent);background:color-mix(in srgb,var(--k-hol) 8%,transparent)}
.wish.k-anniv{border-color:color-mix(in srgb,var(--k-anniv) 45%,transparent);background:color-mix(in srgb,var(--k-anniv) 7%,transparent)}
.wish-h{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:600;font-size:14px}
.wish-h .ic{width:26px;height:26px}
.wish-h .ic svg{width:22px;height:22px}
.wish p{margin:0;font-style:italic;font-size:17px;line-height:1.4}
.wish-h{white-space:nowrap}
.wish .row{flex-wrap:nowrap}
@media (max-width:1180px){.wish{grid-template-columns:minmax(0,1fr)!important;row-gap:6px}.wish-h{white-space:normal}.wish .row{flex-wrap:wrap}}
.wish .row{display:flex;gap:8px;flex-wrap:wrap}
.wish a.btn{text-decoration:none}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:7px;height:11px;border-radius:2px;opacity:0}
@media (prefers-reduced-motion:no-preference){
  .confetti i{animation:fall 1.9s cubic-bezier(.25,.6,.4,1) forwards}
  @keyframes fall{0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}100%{opacity:0;transform:translate3d(var(--dx),150px,0) rotate(var(--rot))}}
  .wish.pop .wish-h .ic{animation:bob 1.2s ease-in-out 2}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
}

.dcarry{margin:14px 0 0 60px;display:flex;flex-direction:column;gap:8px;border:1px dashed var(--marg);border-radius:8px;padding:10px 12px;font-family:var(--sans);font-size:13px}
.dcarry .row{display:flex;gap:8px;flex-wrap:wrap}
.dlines{margin-top:14px;border-top:1px solid var(--rule)}
.drow{display:grid;grid-template-columns:44px 1fr;column-gap:16px;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--L) - 1px),var(--rule) calc(var(--L) - 1px),var(--rule) var(--L))}
.dnum{all:unset;cursor:pointer;height:var(--L);line-height:var(--L);text-align:right;font-family:var(--sans);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.dnum:disabled{cursor:default}
.dnum:not(:disabled):hover{color:var(--accent)}
.dtxt{display:block;width:100%;min-width:0;border:0;margin:0;padding:0;resize:none;overflow:hidden;background:transparent;font-family:var(--serif);font-size:var(--fs);line-height:var(--L);height:var(--L);color:var(--ink);caret-color:var(--accent);outline:none}
.dtxt::placeholder{color:var(--muted);opacity:.75;font-style:italic}
.drow.done .dtxt,.dstruck{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:1.5px;color:var(--muted)}
.drow.done .dnum{color:var(--accent);text-decoration:line-through}
.drow.fw .dtxt{color:var(--muted);font-style:italic}
.drow.fw .dnum{color:var(--accent)}
.dfill{flex:1 0 auto;min-height:calc(var(--L) * 6);cursor:text;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--L) - 1px),var(--rule) calc(var(--L) - 1px),var(--rule) var(--L))}
.dfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0 0 68px;font-family:var(--sans);font-size:11.5px;color:var(--muted)}
.results{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.results li{border-bottom:1px dashed var(--line)}
.results button{all:unset;cursor:pointer;display:block;width:100%;padding:10px 2px}
.results .where{font-family:var(--sans);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.results mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:2px}

/* page turn */
.dpaper.dghost{position:absolute;left:0;right:0;margin:0;z-index:5;pointer-events:none}
.dturning{transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform}
.dshT,.dshU,.dshHL{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:inherit;will-change:opacity,transform}
.dshT{background:linear-gradient(to left,rgba(0,0,0,.42) 0%,rgba(0,0,0,.14) 18%,rgba(0,0,0,0) 55%,rgba(0,0,0,.08) 100%)}
.dshHL{left:auto;width:45%;right:0;background:linear-gradient(to right,rgba(255,255,255,0),rgba(255,255,255,.22) 50%,rgba(255,255,255,0))}
.dshU{background:linear-gradient(to right,rgba(0,0,0,.38) 0%,rgba(0,0,0,.12) 22%,rgba(0,0,0,0) 60%)}
@media (prefers-reduced-motion:no-preference){
  .turn-next{animation:tnx .24s cubic-bezier(.2,.8,.2,1)}
  .turn-prev{animation:tpx .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes tnx{from{opacity:.35;transform:translateX(16px)}to{opacity:1;transform:none}}
  @keyframes tpx{from{opacity:.35;transform:translateX(-16px)}to{opacity:1;transform:none}}
  .dcal:not([hidden]) .dcalcard{animation:dpop .16s ease-out}
  @keyframes dpop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .lock:not([hidden]){animation:lockIn .18s ease-out}
  @keyframes lockIn{from{opacity:0}to{opacity:1}}
  .lock{transition:opacity .2s ease}
}

/* settings */
.sheet{display:flex;flex-direction:column;gap:18px;background:var(--ivory);border-radius:6px;padding:20px 18px;box-shadow:0 12px 30px -14px var(--shadow)}
.sheet h2{margin:0;font-size:30px;font-weight:500}
.set{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--rule);padding-top:14px}
.set .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set-line{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0;font-size:17px;flex-wrap:wrap}
.set-line b{font-family:var(--sans);font-size:13.5px;font-weight:600;overflow-wrap:anywhere}

<script>

const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);

function gInit(){if(gClient)return gClient;if(!window.google||!google.accounts||!google.accounts.oauth2)return null;
  gClient=google.accounts.oauth2.initTokenClient({client_id:GCID,scope:GSCOPE,callback:()=>{}});return gClient}
function gAuth(prompt,scope){return new Promise((ok,no)=>{
  const c=gInit();if(!c)return no(new Error('Google sign-in has not loaded yet. Please try again in a moment.'));
  const want=scope||GSCOPE;
  c.callback=r=>{if(r.error)return no(new Error(r.error==='access_denied'?'Access was not granted.':(r.error_description||r.error)));
    gScopes=r.scope||want;
    if(/calendar/.test(want)&&!/calendar/.test(gScopes))return no(new Error('Calendar access was not granted. Please tick the calendar permission.'));
    gTok=r.access_token;gExp=Date.now()+((+r.expires_in||3600)-60)*1000;try{sessionStorage.setItem('gtok',JSON.stringify({t:gTok,exp:gExp,s:gScopes}));localStorage.setItem('alok-gscopes',gScopes)}catch(e){}ok()};

async function gFetch(url){
  const r=await fetch(url,{headers:{Authorization:'Bearer '+gTok}});
  if(r.status===401){gTok=null;try{sessionStorage.removeItem('gtok')}catch(e){}throw new Error('expired')}
  if(!r.ok){const j=await r.json().catch(()=>({}));const m=j.error&&j.error.message||('Google returned an error ('+r.status+').');
    throw new Error(/has not been used|is disabled/i.test(m)?'The Google Calendar API is not enabled for this app yet. Please enable it in Google Cloud (see the steps in Settings).':m)}
  return r.json();
}
const FESTIVALS=/diwali|deepavali|holi\b|bhai ?duj|bhai ?dooj|raksha ?bandhan|rakhi|dussehra|vijaya ?dashami|navratri|janmashtami|ganesh ?chaturthi|makar ?sankranti|lohri|pongal|karwa|karva|chhat|chhath|govardhan|dhanteras|eid|christmas|new year|guru nanak|mahavir|buddha purnima|ram navami|maha ?shivaratri|baisakhi|vaisakhi|onam|independence day|republic day|gandhi jayanti/i;
function gImported(e){return !!(e.start&&e.start.date&&e.recurringEventId&&/^1900-/.test(e.created||''))}
function gKind(e,c){
  const t=(e.summary||'');
  if(gImported(e))return /anniversary|marriage|wedding/i.test(t)?'anniv':'bday';
  if(e.eventType==='birthday'||/birthday|b'?day|janamdin/i.test(t))return 'bday';
  if(/anniversary|marriage day|wedding day/i.test(t))return 'anniv';
  if(/#holiday@/.test(c.id))return 'hol';
  if(/moon/i.test(c.summary||'')||/full moon|new moon|first quarter|last quarter/i.test(t))return 'moon';
  if(/to-?do/i.test(c.description||'')||/to-?do|task/i.test(c.summary||''))return 'task';
  if(/flight|train|travel|trip|journey|yatra|bus to|depart/i.test(t))return 'travel';
  if(/\bpay\b|payment|bill|emi|premium|renew|due|tax|rent/i.test(t))return 'pay';
  if(e.hangoutLink||/meeting|call|review|\bvc\b|zoom|teams|interview|conference/i.test(t))return 'meet';
  return 'ev';
}
function gNorm(e,c){
  const allDay=!!(e.start&&e.start.date);let d,last,tm='';
  if(allDay){d=e.start.date;last=e.end&&e.end.date?dAdd(e.end.date,-1):d;if(last<d)last=d}
  else{const s=new Date(e.start.dateTime);d=dFmt(s);last=d;tm=s.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}).toUpperCase()}
  const kind=gKind(e,c);
  const ev={id:e.id,d,last,tm,t:(e.summary||'(No title)').trim(),k:kind,l:e.htmlLink||'',c:c.id,pub:kind==='hol'&&/public holiday/i.test(e.description||'')?1:0};
  if(kind==='bday'||kind==='anniv'){
    const m=ev.t.match(/^(\d{4})\s+(.+)$/);if(m){ev.yr=+m[1];ev.nm=m[2].trim()}
    if(kind==='bday'&&!ev.nm){const n=bdayName(ev.t);if(n)ev.nm=n}
    if(kind==='anniv'&&!ev.nm){const n=ev.t.replace(/(['’]s)?\s*(wedding\s*|marriage\s*)?anniversary/i,'').trim()||String(e.description||'').split('\n')[0].trim().slice(0,40);if(n)ev.nm=n}
  }

}
async function gSync(interactive){
  if(gBusy)return;gBusy=true;gErr='';renderGStatus();
  try{
    if(!gTok||Date.now()>gExp||!/calendar/.test(gScopes||'calendar')){if(!interactive){gBusy=false;renderGStatus();return}await gAuth(G.connected?'':'consent',GSCOPE)}
    const list=await gFetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader&maxResults=250');
    const cals=(list.items||[]).filter(c=>!c.hidden);
    const tMin=new Date(Date.now()-90*864e5).toISOString(),tMax=new Date(Date.now()+366*864e5).toISOString();
    const evs=[],seen=new Set();
    for(const c of cals){
      let pt='';
      do{const u=`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(c.id)}/events?singleEvents=true&orderBy=startTime&maxResults=2500&timeMin=${encodeURIComponent(tMin)}&timeMax=${encodeURIComponent(tMax)}&fields=nextPageToken,items(id,summary,description,start,end,htmlLink,eventType,hangoutLink,status,created,recurringEventId)${pt?'&pageToken='+encodeURIComponent(pt):''}`;
        const j=await gFetch(u);
        (j.items||[]).forEach(e=>{if(e.status==='cancelled'||!e.start||e.eventType==='workingLocation')return;const n=gNorm(e,c);
          const key=(n.k==='hol'||n.k==='bday'?n.k:n.c)+'|'+n.d+'|'+n.t.toLowerCase()+'|'+n.tm;if(seen.has(key))return;seen.add(key);
          if(n.k==='hol')n.c='holidays';evs.push(n)});
        pt=j.nextPageToken}while(pt);
    }
    const hol=cals.filter(c=>/#holiday@/.test(c.id));
    G.cals=cals.filter(c=>!/#holiday@/.test(c.id)).map(c=>({id:c.id,name:c.primary?'My calendar':(c.summaryOverride||c.summary||c.id)}));
    if(hol.length)G.cals.push({id:'holidays',name:'Holidays in India'});
    G.events=evs.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.tm?1:0)-(b.tm?1:0)||a.tm.localeCompare(b.tm));
    G.connected=true;G.v2=1;G.fetchedAt=Date.now();mark('gcal');saveNow();
    refreshNext();if(interactive)toast(`Calendar updated: ${evs.length} events`);
  }catch(e){
    if(e.message==='expired'&&interactive){gBusy=false;return gSync(true)}
    gErr=e.message==='expired'?'':e.message;
  }
  gBusy=false;render(true);
}
function gAutoRefresh(){if(G.connected&&gTok&&Date.now()<gExp&&Date.now()-G.fetchedAt>2*3600e3)gSync(false)}
function gDisconnect(){
  try{if(gTok&&window.google&&google.accounts.oauth2)google.accounts.oauth2.revoke(gTok,()=>{})}catch(e){}
  gTok=null;try{sessionStorage.removeItem('gtok')}catch(e){}
  G={connected:false,events:[],cals:[],off:[],fetchedAt:0,_ts:0};mark('gcal');saveNow();render();toast('Google Calendar disconnected');
}
function evOn(d){return G.events.filter(e=>e.d<=d&&e.last>=d&&!G.off.includes(e.c)).sort((a,b)=>{const r=x=>x.k==='bday'?0:x.k==='anniv'?1:x.k==='hol'?2:x.tm?4:3;return r(a)-r(b)||a.tm.localeCompare(b.tm)})}
function renderGStatus(){const el=$('gStatus');if(el)el.innerHTML=gStatusHTML()}
function gStatusHTML(){

}

const WX_PRECISE=5000;

function getPos(){return new Promise(ok=>{if(!navigator.geolocation)return ok(null);try{navigator.geolocation.getCurrentPosition(p=>ok({lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3),acc:p.coords.accuracy}),()=>ok(null),{timeout:12000,maximumAge:30*60e3,enableHighAccuracy:false})}catch(e){ok(null)}})}
async function placeName(lat,lon){
  try{const r=await withTimeout(fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`),8000);if(!r.ok)throw 0;const j=await r.json();
    const city=j.city||j.locality||'',st=(j.principalSubdivisionCode||'').split('-')[1]||j.principalSubdivision||'';return [city,st].filter(Boolean).join(', ')||'Your location'}catch(e){return 'Your location'}
}
async function wxLocation(){
  if(WXLOC&&!WXLOC.def&&Date.now()-WXLOC.at<30*60e3)return WXLOC;
  if(lockMode!=='open')return WXLOC||WXDEF;
  const pos=await getPos();
  if(!pos||!(pos.acc<=WX_PRECISE))return WXDEF;
  const moved=!WXLOC||Math.abs(WXLOC.lat-pos.lat)>.02||Math.abs(WXLOC.lon-pos.lon)>.02;
  WXLOC={lat:pos.lat,lon:pos.lon,name:moved||!WXLOC.name?await placeName(pos.lat,pos.lon):WXLOC.name,at:Date.now()};
  try{localStorage.setItem('alok-wxloc',JSON.stringify(WXLOC))}catch(e){}return WXLOC;
}

function wxInfo(code,day){
  if(code===0)return [day?'Clear sky':'Clear night',day?'sun':'moonc'];
  if(code<=2)return ['Partly cloudy',day?'psun':'cloud'];if(code===3)return ['Overcast','cloud'];
  if(code===45||code===48)return ['Fog','fog'];if(code>=51&&code<=57)return ['Drizzle','rain'];
  if(code>=61&&code<=67||code>=80&&code<=82)return ['Rain','rain'];if(code>=71&&code<=77||code===85||code===86)return ['Snow','cloud'];
  if(code>=95)return ['Thunderstorm','storm'];return ['Weather','cloud'];
}

async function loadWeather(force){
  const loc=await wxLocation();
  if(!force&&WX&&WX.name===loc.name&&Date.now()-WX.at<30*60e3)return;
  try{
    const r=await withTimeout(fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code,is_day&timezone=auto`),10000);
    if(!r.ok)throw 0;const j=await r.json();const c=j.current;if(!c||typeof c.temperature_2m!=='number')throw 0;
    WX={t:Math.round(c.temperature_2m),code:c.weather_code,day:c.is_day!==0,at:Date.now(),name:loc.name,def:!!loc.def};wxSrc=loc.def?'home':'gps';try{localStorage.setItem('alok-wx',JSON.stringify(WX))}catch(e){}
    document.querySelectorAll('.wxSlot').forEach(el=>el.outerHTML=wxHTML());
  }catch(e){}
}
setInterval(()=>{if(!document.hidden)loadWeather()},10*60e3);

}

function monthGrid(y,m,attr){
  const first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate(),t=today(),fu=firstUseDate();
  let h=['S','M','T','W','T','F','S'].map(w=>`<span class="wd">${w}</span>`).join('');
  for(let i=0;i<start;i++)h+='<span class="day out"></span>';
  for(let d=1;d<=days;d++){const s=y+'-'+pad(m+1)+'-'+pad(d),ev=evOn(s),has=dHas(s),hasB=ev.some(e=>e.k==='bday'||e.k==='anniv'),hasE=ev.some(e=>e.k!=='bday'&&e.k!=='anniv'&&e.k!=='moon');
    const none=!has&&s<t&&s>=fu;
    const dots=(has?'<i></i>':'')+(hasB?'<i class="b"></i>':'')+(hasE?'<i class="e"></i>':'');
    h+=`<button class="day${s===t?' today':''}${s===diaryDate?' sel':''}${none?' none':''}" ${attr}="${s}" type="button" aria-label="${dLong(s)}${has?', has writing':none?', no entry':''}${ev.length?', '+ev.length+' calendar '+(ev.length===1?'event':'events'):''}">${d}${dots?`<span class="dots">${dots}</span>`:''}</button>`}
  return `<div class="grid">${h}</div>`;
}

function words(p){return (p&&p.items?p.items:[]).reduce((a,l)=>a+(l.t&&l.t.trim()?l.t.trim().split(/\s+/).length:0),0)}
function monthStats(y,m){
  const days=new Date(y,m+1,0).getDate(),t=today(),pre=y+'-'+pad(m+1)+'-';
  let entries=0,w=0,elapsed=0;
  for(let d=1;d<=days;d++){const s=pre+pad(d);if(s<=t)elapsed++;if(dHas(s)){entries++;w+=words(S.diary[s])}}
  const from=firstUseDate();let base=0;for(let d=1;d<=days;d++){const s=pre+pad(d);if(s<=t&&s>=from)base++}
  return {entries,words:w,elapsed,consistency:base?Math.round(entries/base*100):0};
}
function curStreak(){let d=today();if(!dHas(d))d=dAdd(d,-1);let n=0;while(dHas(d)&&n<4000){n++;d=dAdd(d,-1)}return n}
function longestStreak(){const k=Object.keys(S.diary).filter(dHas).sort();let best=0,run=0,prev=null;k.forEach(d=>{run=prev&&dDiff(d,prev)===1?run+1:1;best=Math.max(best,run);prev=d});return best}

/* ---------- Google Drive attachments (drive.file: the app sees only files it created) ---------- */
const DSCOPE='https://www.googleapis.com/auth/drive.file';
function driveReady(){return gTok&&Date.now()<gExp&&/drive\.file/.test(gScopes||'')}
function pickFiles(accept){
  const f=document.createElement('input');f.type='file';f.multiple=true;if(accept)f.accept=accept;
  f.onchange=()=>{const list=[...f.files].filter(x=>{if(x.size>100*1048576){toast(`${x.name} is larger than 100 MB and was skipped.`);return false}return true});if(!list.length)return;
    pendingFiles=pendingFiles.concat(list.map(file=>({file,date:diaryDate})));if(driveReady())uploadPending();else render()};
  f.click();
}
async function makeThumb(file){
  if(!/^image\//.test(file.type))return null;
  try{const u=URL.createObjectURL(file);const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u});
    const m=220,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);return c.toDataURL('image/jpeg',.72)}catch(e){return null}
}
async function driveFolder(){
  if(G.folder)return G.folder;
  const q=encodeURIComponent("name='Alok’s Diary' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const j=await gFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`);
  if(j.files&&j.files[0]){G.folder=j.files[0].id}
  else{const r=await fetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{Authorization:'Bearer '+gTok,'Content-Type':'application/json'},body:JSON.stringify({name:'Alok’s Diary',mimeType:'application/vnd.google-apps.folder'})});
    if(!r.ok)throw await driveErr(r);G.folder=(await r.json()).id}
  mark('gcal');return G.folder;
}
async function driveErr(r){const j=await r.json().catch(()=>({}));const m=j.error&&j.error.message||('Google Drive returned an error ('+r.status+').');return new Error(/has not been used|is disabled/i.test(m)?'The Google Drive API is not enabled for this app. Please enable it in Google Cloud.':m)}
async function driveUpload(file,d,folder){
  const type=file.type||'application/octet-stream',meta={name:`${d} · ${file.name}`,parents:[folder],mimeType:file.type||undefined,description:'Saved from Alok’s Diary for '+d};
  const init=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,mimeType,size,webViewLink',{method:'POST',headers:{Authorization:'Bearer '+gTok,'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':type,'X-Upload-Content-Length':String(file.size)},body:JSON.stringify(meta)});
  if(!init.ok)throw await driveErr(init);
  const loc=init.headers.get('Location');let res;
  if(loc){res=await fetch(loc,{method:'PUT',headers:{'Content-Type':type},body:file})}
  else{const bd='diary'+uid();const body=new Blob([`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: ${type}\r\n\r\n`,file,`\r\n--${bd}--`]);
    res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,size,webViewLink',{method:'POST',headers:{Authorization:'Bearer '+gTok,'Content-Type':'multipart/related; boundary='+bd},body})}
  if(!res.ok)throw await driveErr(res);return res.json();
}
async function uploadPending(){
  if(!pendingFiles.length)return;
  try{if(!driveReady())await gAuth(/drive\.file/.test(localStorage.getItem('alok-gscopes')||'')?'':'consent',GSCOPE+' '+DSCOPE)}
  catch(e){toast(e.message||'Google Drive access was not granted.');return}
  if(!/drive\.file/.test(gScopes||'')){toast('Google Drive access was not granted. Please tick the Drive permission.');return}
  const batch=pendingFiles;pendingFiles=[];uploading=uploading.concat(batch.map(x=>({name:x.file.name})));render();
  let ok=0;
  try{const folder=await driveFolder();
    for(const x of batch){
      try{const [j,thumb]=await Promise.all([driveUpload(x.file,x.date,folder),makeThumb(x.file)]);
        const p=dOwn(x.date);p.att=(p.att||[]).concat([{id:uid(),fid:j.id,name:x.file.name,mime:x.file.type||j.mimeType||'',size:x.file.size,link:j.webViewLink||('https://drive.google.com/file/d/'+j.id+'/view'),thumb:thumb||undefined,at:Date.now()}]);
        mark(dKey(x.date));ok++}
      catch(e){toast(`${x.file.name}: ${e.message==='expired'?'Google sign-in expired. Please try again.':e.message}`)}
      uploading=uploading.filter(u=>u.name!==x.file.name);render();
    }
  }catch(e){uploading=[];render();toast(e.message==='expired'?'Google sign-in expired. Please try again.':e.message);return}
  if(ok)toast(`${ok} ${ok===1?'file':'files'} saved to Google Drive · Alok’s Diary folder`);
}

/* ---------- automatic local backups (IndexedDB, one per day, last 14 kept) ---------- */
function idb(){return new Promise((ok,no)=>{try{const r=indexedDB.open('alok-diary',1);r.onupgradeneeded=()=>r.result.createObjectStore('snaps',{keyPath:'day'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
async function autoSnapshot(){
  try{const n=Object.keys(S.diary).filter(dHas).length;if(!n)return;const db=await idb(),day=today();
    await new Promise((ok,no)=>{const tx=db.transaction('snaps','readwrite'),st=tx.objectStore('snaps');st.put({day,at:Date.now(),pages:n,diary:JSON.parse(JSON.stringify(S.diary))});
      const kr=st.getAllKeys();kr.onsuccess=()=>{kr.result.sort().slice(0,-14).forEach(k=>st.delete(k))};tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});
  }catch(e){}
}
async function listSnaps(){try{const db=await idb();return await new Promise((ok,no)=>{const r=db.transaction('snaps').objectStore('snaps').getAll();r.onsuccess=()=>ok(r.result.map(s=>({day:s.day,at:s.at,pages:s.pages})).sort((a,b)=>a.day<b.day?1:-1));r.onerror=()=>no(r.error)})}catch(e){return []}}

  ['sb-pin','sb-dirty',KEY,GKEY,'second-brain-v2'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  S={diary:{}};G={connected:false,events:[],cals:[],off:[],fetchedAt:0,_ts:0};gTok=null;try{sessionStorage.removeItem('gtok')}catch(e){}
  view='diary';diaryDate=today();dq='';mSearch=false;app.__html='';render();signupMode=false;lock('login');setSync('local');
}
async function updateApp(){
  const b=$('sUpdate');if(b){b.disabled=true;b.textContent='Updating…'}
  dFlushSoon();try{if(dirty.size)await flush()}catch(e){}saveNow();
  try{if('serviceWorker' in navigator){const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}if(window.caches)for(const k of await caches.keys())await caches.delete(k)}catch(e){}
  location.reload();
}
function saveFile(data,name,type){const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function backupJSON(){saveFile(JSON.stringify({app:'alok-diary',version:APP_VERSION,exported:new Date().toISOString(),diary:S.diary},null,1),'alok-diary-backup-'+today()+'.json','application/json');toast('Backup downloaded')}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}
async function backupXLSX(from,to){
  try{await loadXLSX()}catch(e){toast('The Excel tool could not load. Please check the internet connection.');return}
  from=from||'0000';to=to||'9999';
  const rows=[];Object.keys(S.diary).filter(d=>d>=from&&d<=to).sort().forEach(d=>{const p=S.diary[d],m=p.mood&&moodOf(p.mood),tg=(p.tags||[]).map(t=>'#'+t).join(' ');
    (p.items||[]).forEach(l=>{if(l.t&&l.t.trim())rows.push({Date:d,Day:dParse(d).toLocaleDateString('en-IN',{weekday:'long'}),Entry:l.t,Type:l.task?'Task':'Note',Status:l.fw?'Moved forward':l.done?'Done':'',Mood:m?m.l:'',Tags:tg,Bookmarked:p.bm?'Yes':''})});
    (p.att||[]).forEach(a=>rows.push({Date:d,Day:dParse(d).toLocaleDateString('en-IN',{weekday:'long'}),Entry:a.name+' — '+a.link,Type:'Attachment',Status:'',Mood:m?m.l:'',Tags:tg,Bookmarked:p.bm?'Yes':''}))});
  if(!rows.length){toast('There are no entries in that date range.');return}
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:11},{wch:70},{wch:11},{wch:14},{wch:11},{wch:22},{wch:11}];XLSX.utils.book_append_sheet(wb,ws,'Diary');
  XLSX.writeFile(wb,'alok-diary-'+(from==='0000'?'all':from+'-to-'+to)+'.xlsx');toast('Excel file downloaded');
}
function restorePick(){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{const j=JSON.parse(await f.files[0].text());const d=j.diary||(j.data&&j.data.diary);if(!d||typeof d!=='object')throw 0;restoreData=d;restoreFrom='the selected file';render();toast('Backup loaded. Please confirm the restore.')}catch(e){toast('That file is not a diary backup.')}};f.click()}
function restoreNow(){if(!restoreData)return;restoreFrom='';const now=Date.now();S.diary=restoreData;Object.values(S.diary).forEach(p=>{p._ts=now;(p.items||[]).forEach(i=>i.u=now)});restoreData=null;snapAll();saveNow();Object.keys(S.diary).forEach(d=>dirty.add('diary:'+d));keepDirty();flush();render();toast('Backup restored')}

/* ================= misc ================= */
const toastEl=$('toast'),undoBtn=$('undo');let toastT;
function toast(msg){$('toastMsg').textContent=msg;undoBtn.hidden=true;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.hidden=true,3500)}
function tickClock(){
  const el=$('clock');if(!el)return;
  const d=new Date();let h=d.getHours();const ap=h<12?'AM':'PM';h=h%12||12;
  const str=pad(h)+pad(d.getMinutes())+pad(d.getSeconds());
  if(!el.firstChild){el.innerHTML=[0,1,'s',2,3,'s',4,5].map(x=>x==='s'?'<span class="csep" aria-hidden="true">:</span>':'<span class="fd" aria-hidden="true"><b></b></span>').join('')+'<span class="ampm"></span>'}
  el.querySelectorAll('.fd').forEach((f,i)=>{const v=str[i];if(f.dataset.v!==v){f.dataset.v=v;f.firstChild.textContent=v;if(f.dataset.init){f.classList.remove('flip');void f.offsetWidth;f.classList.add('flip')}f.dataset.init='1'}});
  el.querySelector('.ampm').textContent=ap;
  el.setAttribute('aria-label','Current time '+str.slice(0,2)+':'+str.slice(2,4)+' '+ap);
}
(function loop(){tickClock();setTimeout(loop,1000-Date.now()%1000+5)})();
setInterval(()=>{const t=today();if(t!==dLastToday){const was=dLastToday;dLastToday=t;if(view==='diary'&&diaryDate===was&&!busyTyping()){diaryDate=t;dAnim='next';sideM=null;render()}else renderSide()}},20000);
let rw=innerWidth;addEventListener('resize',()=>{if(innerWidth!==rw){const cross=(rw>=1000)!==(innerWidth>=1000);rw=innerWidth;if(cross){applyPrefs();closeDrawer()}else document.querySelectorAll('#dlines .dtxt').forEach(dAutosize)}});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>document.querySelectorAll('#dlines .dtxt').forEach(dAutosize));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDCal();closeMood();closeDrawer();if(document.documentElement.classList.contains('focus')&&!(document.activeElement&&document.activeElement.classList.contains('dtxt')))toggleFocus();return}
  if(lockMode!=='open')return;
  if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){e.preventDefault();if(view==='diary')saveEntry();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const a=document.activeElement,typing=a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'||a.tagName==='SELECT');if(typing)return;
  if($('dcal')&&!$('dcal').hidden)return;
  if(e.key==='/'){e.preventDefault();focusSearch();return}
  if(view!=='diary')return;
  if(e.key==='ArrowLeft'){e.preventDefault();dGo(dAdd(diaryDate,-1),'prev')}
  else if(e.key==='ArrowRight'){e.preventDefault();dGo(dAdd(diaryDate,1),'next')}
  else if(e.key==='t'||e.key==='T'){dGo(today())}
  else if(e.key==='c'||e.key==='C'){if($('dDate'))openDCal()}
  else if(e.key==='b'||e.key==='B'){toggleBookmark()}
  else if(e.key==='f'||e.key==='F'){toggleFocus()}
});

/* ================= start ================= */
snapAll();applyPrefs();loadWeather();
history.replaceState({v:'diary'},'',location.pathname);
(async()=>{
  const hasSess=(()=>{try{return Object.keys(localStorage).some(k=>/^sb-.+-auth-token$/.test(k))}catch(e){return false}})();
  const owner=(()=>{try{return localStorage.getItem(OWNKEY)}catch(e){return null}})();
  render();
  if(hasSess&&owner&&pinRec){me={id:owner,email:''};if(recentActive()){lockMode='open';lockEl.hidden=true;document.documentElement.classList.remove('locked')}else lock('pin')}
  else{document.documentElement.classList.add('locked');drawLock()}
  if(!window.supabase){
    if(pinRec&&owner){me={id:owner,email:''};if(recentActive())unlock();else lock('pin');setSync('offline')}
    else lock('login','No internet connection. Please connect once to sign in.');
    return;
  }
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_IN'&&session&&!col)setTimeout(()=>{if(!col)onSignedIn(session.user,false)},0)});
  const {data:{session}}=await sb.auth.getSession();
  if(session&&!col)await onSignedIn(session.user,false);
  else if(!session)lock('login');
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
