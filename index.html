.dday.has::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}

.dcalfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}

  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lk-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.lk-brand{font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}

.chk:checked{background:var(--ink)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:14px;border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:20;max-width:calc(100% - 32px)}
.toast button{all:unset;cursor:pointer;font-weight:700;color:var(--paper);text-decoration:underline}
@media (prefers-reduced-motion:no-preference){
.enter-fwd{animation:inF .24s cubic-bezier(.2,.8,.2,1)}
.enter-back{animation:inB .24s cubic-bezier(.2,.8,.2,1)}
@keyframes inF{from{opacity:.4;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:.4;transform:translateX(-18px)}to{opacity:1;transform:none}}

@keyframes lockIn{from{opacity:0}to{opacity:1}}
}

<input type="file" id="avIn" accept="image/*" hidden>
<button class="gear" id="gear" type="button" aria-label="Settings" hidden><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
<button class="fab" id="fab" type="button" aria-label="Add new entry" hidden>+</button>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="undo" type="button">Undo</button></div>

<script>
const BUILTIN=[
 {id:'dump',title:'Brain Dump',kind:'list',tags:['Idea','To do','To buy','Quote','Video','Link'],hint:'Ideas, quotes, things to buy, videos to watch.',
  line:'If you think <b>“I’ll remember this later”</b>, write it down now. Later usually never comes.',ph:'Write it down immediately…',
  ex:[['Idea','Weekly review template for the team'],['To buy','Printer cartridge'],['Video','Power Query basics tutorial']]},
 {id:'forget',title:'Things I’ll Forget',kind:'list',tags:['Restaurant','Gift idea','Movie','Series','Book','Place','Product'],hint:'Recommendations, gift ideas, movies, books.',
  line:'Instead of saying <b>“I’ll remember that…”</b> write it down.',ph:'Restaurant, gift, movie, book…',
  ex:[['Restaurant','Recommended by a colleague: the thali place near the station'],['Book','Atomic Habits']]},
 {id:'someday',title:'Someday List',kind:'list',tags:['Place','Skill','Business','Experience','Book to write'],hint:'Not everything needs to happen this month.',
  line:'Places, skills, businesses, books. When inspiration comes, <b>you’ll know where to find it.</b>',ph:'Someday I want to…',
  ex:[['Place','Spiti Valley road trip'],['Skill','Learn Python for automation']]},
 {id:'admin',title:'Life Admin',kind:'admin',tags:['Document','Insurance','Warranty','Subscription','Vehicle','Bill'],hint:'Expiry dates, renewals, insurance, warranties.',
  line:'You’ll almost never open this note, <b>until the day you’re glad you made it.</b>',ph:'e.g. Passport expiry',
  ex:[['Passport expiry','2029-03-14','Document'],['Car insurance renewal','2027-01-10','Insurance'],['Washing machine warranty','2027-06-30','Warranty']]},
 {id:'people',title:'People',kind:'people',hint:'Favourite coffee, birthdays, what they’re working toward.',
  line:'Remembering small things <b>makes people feel valued.</b>',
  ex:[['Rahul','Favourite coffee: cold coffee, less sugar','08-12'],['Neha','Preparing for CA final exams','']]},
 {id:'smile',title:'Things That Made Me Smile',kind:'list',dated:true,tags:['Moment','Compliment','Conversation','Kindness','Family','Achievement'],hint:'Some moments deserve words, not photos.',
  line:'On difficult days, this note is a reminder that <b>life wasn’t always heavy.</b>',ph:'Today something made me smile…',
  ex:[['Moment','Sunset from the office terrace']]},
 {id:'reset',title:'Monthly Reset',kind:'check',hint:'Same checklist on the 1st of every month.',
  line:'It takes a few minutes, <b>but life feels a lot less messy.</b>',ph:'Add a checklist item…',
  defaults:['Delete blurry photos','Clear the Downloads folder','Review subscriptions','Plan the next month']},
 {id:'blank',title:'Untitled',kind:'free',hint:'No title. No purpose. Just an empty page.',
  line:'The best ideas arrive when you least expect them. <b>You already have somewhere to put them.</b>'}
];
const KEY='second-brain-v2', OLDKEY='second-brain-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const month=()=>today().slice(0,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const fmtMD=md=>new Date('2000-'+md+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const $=id=>document.getElementById(id);

function allNotes(){return BUILTIN.concat((S.custom||[]).map(c=>({id:c.id,title:c.title,kind:'list',custom:true,
  tags:['Note','Idea','To do','Link'],hint:'Your own note.',line:'Your own list. <b>Write it down.</b>',ph:'Add an entry…'})))}
function blank(n){
  const items=[];
  if(n.kind==='admin')(n.ex||[]).forEach(([t,d,g])=>items.push({id:uid(),t,due:d,tag:g,ex:1}));
  else if(n.kind==='people')(n.ex||[]).forEach(([w,t,b])=>items.push({id:uid(),who:w,t,bday:b||null,ex:1}));
  else if(n.kind==='check')n.defaults.forEach(t=>items.push({id:uid(),t,done:false}));
  else (n.ex||[]).forEach(([tag,t])=>items.push({id:uid(),t,tag,date:n.dated?today():null,ex:1}));
  return {items,text:''};
}
function fresh(){const s={notes:{},diary:{},custom:[],resetMonth:month()};BUILTIN.forEach(n=>s.notes[n.id]=blank(n));return s}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem(OLDKEY))}catch(e){}
if(!S||!S.notes)S=fresh();
S.custom=S.custom||[];
S.diary=S.diary||{};
S.tags=S.tags||{};
function ensure(){allNotes().forEach(n=>{if(!S.notes[n.id])S.notes[n.id]=n.custom?{items:[],text:''}:blank(n)})}
ensure();

/* ---------- saving: this device + private cloud sync ---------- */
let col=null, sync='local', syncErr='';
const dirty=new Set((()=>{try{return JSON.parse(localStorage.getItem('sb-dirty'))||[]}catch(e){return []}})()); let writing=false, flushT;
function keepDirty(){try{localStorage.setItem('sb-dirty',JSON.stringify([...dirty]))}catch(e){}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* entry-level change tracking: every entry carries its own last-changed time (u); deleted entries leave a dated marker (del) */
const SNAP=new WeakMap();
const ij=i=>{const c=Object.assign({},i);delete c.u;return JSON.stringify(c)};
function getRef(k){return k.startsWith('diary:')?(S.diary||{})[k.slice(6)]:S.notes[k]}
function setRef(k,v){if(k.startsWith('diary:'))S.diary[k.slice(6)]=v;else S.notes[k]=v}
function snapNote(k){const n=getRef(k);if(n&&Array.isArray(n.items))SNAP.set(n,new Map(n.items.map(i=>[i.id,ij(i)])))}
function snapAll(){Object.keys(S.notes).forEach(snapNote);Object.keys(S.diary||{}).forEach(d=>snapNote('diary:'+d))}
function stamp(k,now){const n=getRef(k);if(!n||!Array.isArray(n.items))return;const prev=SNAP.get(n);
  n.items.forEach(i=>{if(prev?prev.get(i.id)!==ij(i):!i.u)i.u=now});
  if(prev){const ids=new Set(n.items.map(i=>i.id));prev.forEach((_,id)=>{if(!ids.has(id)){n.del=n.del||{};n.del[id]=now}})}
  n._ts=now;snapNote(k)}
function mergeNote(L,R){
  const del=Object.assign({},R.del||{});for(const [k,v] of Object.entries(L.del||{}))del[k]=Math.max(del[k]||0,v);
  const lm=new Map((L.items||[]).map(i=>[i.id,i])),rm=new Map((R.items||[]).map(i=>[i.id,i]));
  const newer=(L._ts||0)>(R._ts||0)?L:R,other=newer===L?R:L;
  const order=[],seen=new Set();
  (newer.items||[]).forEach(i=>{seen.add(i.id);order.push(i.id)});
  (other.items||[]).forEach((i,x)=>{if(!seen.has(i.id)){seen.add(i.id);order.splice(Math.min(x,order.length),0,i.id)}});
  const items=order.map(id=>{const a=lm.get(id),b=rm.get(id);const w=a&&b?((a.u||0)>(b.u||0)?a:b):(a||b);return del[id]&&del[id]>=(w.u||0)?null:w}).filter(Boolean);
  const cut=Date.now()-60*864e5;for(const k in del)if(del[k]<cut)delete del[k];
  return Object.assign({items:[],text:''},other,newer,{items,del,_ts:Math.max(L._ts||0,R._ts||0)});
}
function mark(...ids){const now=Date.now();ids.forEach(i=>{dirty.add(i);if(i==='meta')S.metaTs=now;else stamp(i,now)});keepDirty();saveLocal();clearTimeout(flushT);flushT=setTimeout(flush,500)}
const docName=id=>id==='meta'?'meta':id.startsWith('diary:')?'d_'+id.slice(6):'n_'+id;
const body=id=>id==='meta'?{custom:S.custom,resetMonth:S.resetMonth,tags:S.tags,photo:S.photo||null,_ts:S.metaTs||0}:getRef(id);
async function flush(){
  if(!col||writing||!dirty.size)return;
  writing=true;setSync('saving');
  while(dirty.size){
    const id=dirty.values().next().value;dirty.delete(id);
    const b=body(id);
    try{ b? await col.doc(docName(id)).set(JSON.parse(JSON.stringify(b))) : await col.doc(docName(id)).delete();keepDirty() }
    catch(e){
      dirty.add(id);keepDirty();writing=false;
      if(e&&e.code==='unavailable'){setSync('offline');setTimeout(flush,5000+Math.random()*3000);return}
      setSync('error',e&&e.message?e.message:'Could not save to sync.');setTimeout(flush,20000);return;
    }
  }
  writing=false;setSync('synced');
}
function setSync(s,msg){sync=s;syncErr=msg||'';const el=$('syncEl');if(el){el.className='sync '+s;el.textContent=syncLabel()}}
function syncLabel(){return sync==='synced'?'Synced · all devices':sync==='offline'?'Offline · will sync later':sync==='saving'?'Saving…':sync==='error'?'Sync paused: '+syncErr:sync==='connecting'?'Connecting…':'Saved on this device only'}

function monthlyReset(){
  if(S.resetMonth!==month()){const r=S.notes.reset;r.history=r.history||{};if(S.resetMonth)r.history[S.resetMonth]={done:r.items.filter(i=>i.done).length,total:r.items.length};r.items.forEach(i=>i.done=false);S.resetMonth=month();mark('reset','meta');
    return 'Checklist reset for '+new Date().toLocaleString('en-IN',{month:'long'})+'.'}
  return '';
}



/* ---------- helpers ---------- */
function daysLeft(d){return Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5)}
function dueTxt(d){const n=daysLeft(d);return n<0?`expired ${-n} days ago`:n===0?'due today':`in ${n} days`}
function bdayIn(md){const t=today(),y=+t.slice(0,4);let n=daysLeft(y+'-'+md);if(n<0)n=daysLeft((y+1)+'-'+md);return n}
function upcoming(){
  const out=[];
  S.notes.admin.items.forEach(i=>{if(i.due&&!i.ex){const n=daysLeft(i.due);if(n<=60)out.push({t:i.t,n,w:dueTxt(i.due),soon:n<=30,go:'admin'})}});
  S.notes.people.items.forEach(i=>{if(i.bday&&!i.ex){const n=bdayIn(i.bday);if(n<=30)out.push({t:i.who+'’s birthday',n,w:n===0?'today':`${fmtMD(i.bday)} · in ${n} days`,soon:n<=7,go:'people'})}});
  const r=S.notes.reset.items,left=r.filter(i=>!i.done).length;
  if(r.length&&left&&+today().slice(8)<=10)out.push({t:'Monthly Reset',n:-1,w:`${left} of ${r.length} left`,soon:true,go:'reset'});
  return out.sort((a,b)=>a.n-b.n);
}
function tagsFor(n){const own=(S.tags[n.id]||[]).filter(t=>!n.tags.some(b=>b.toLowerCase()===t.toLowerCase()));return n.tags.concat(own)}
function tagSel(n){const cur=selTag[n.id]||'';
  return `<select id="fT" aria-label="Type">${tagsFor(n).map(t=>`<option ${!newTagOpen&&t===cur?'selected':''}>${esc(t)}</option>`).join('')}<option value="__new" ${newTagOpen?'selected':''}>+ New type…</option></select><input id="f4" placeholder="New type name" maxlength="24" autocomplete="off" aria-label="New type name" ${newTagOpen?'':'hidden'} style="flex:1 1 140px">`}
function greet(){const h=new Date().getHours();return h<5?'Good night':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night'}
const THOUGHTS=['If you think you’ll remember it later, write it down now.','Some moments deserve words, not photos.','Remembering small things makes people feel valued.','Not everything needs to happen this month.','A few minutes of reset makes life feel less messy.','The best ideas arrive when you least expect them.','Don’t trust your memory. Trust your system.','Less time remembering means more time living.'];
function thought(){const d=new Date(),start=new Date(d.getFullYear(),0,0);return THOUGHTS[Math.floor((d-start)/864e5)%THOUGHTS.length]}
function colorOf(n){return `var(--c${allNotes().findIndex(x=>x.id===n.id)%8+1})`}
function delItem(noteId,itemId){const d=S.notes[noteId];if(!d)return;const i=d.items.findIndex(x=>x.id===itemId);if(i<0)return;lastDeleted={id:noteId,item:d.items[i],at:i};d.items.splice(i,1);mark(noteId);render();toast('Deleted',true)}
const RESET_SUGG=[['Sort the Brain Dump','review'],['Check Life Admin dates','admin'],['Review the Someday List','someday'],['Pay credit card bills'],['Check bank statements'],['Update the budget sheet'],['Back up phone photos'],['Clear WhatsApp media'],['Clean the email inbox'],['Check car PUC and service'],['Recharge and pay utility bills'],['Plan one family outing']];
const pinSort=arr=>arr.map((x,i)=>[x,i]).sort((a,b)=>(b[0].pin?1:0)-(a[0].pin?1:0)||a[1]-b[1]).map(p=>p[0]);
function hl(text,q){const s=esc(text);if(!q)return s;const i=s.toLowerCase().indexOf(esc(q).toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+esc(q).length)+'</mark>'+s.slice(i+esc(q).length)}

/* ---------- views ---------- */
let view='home', q='', lastDeleted=null, toastT, memId=null, review=null, confirmDel=false, filterTag=null, newTagOpen=false;
const selTag={};
const app=$('app');

function render(preserve){
  const keep={},ae=document.activeElement;let aid=null,sel=null;
  if(preserve){app.querySelectorAll('input[id],textarea[id],select[id]').forEach(e=>{if(e.type!=='checkbox')keep[e.id]=e.value});
    if(ae&&ae.id){aid=ae.id;try{sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}}}
  if(view==='review'&&!review)view='dump';
  if(view!=='home'&&!S.notes[view]&&view!=='review'&&view!=='settings'&&view!=='journal')view='home';
  view==='home'?home():view==='review'?reviewView():view==='settings'?settingsView():view==='journal'?diaryView():sheet();
  const gear=$('gear');if(gear)gear.hidden=view!=='home';
  if(typeof tickClock==='function')tickClock();
  const fab=$('fab');if(fab)fab.hidden=!(view==='home'?!q.trim():!!$('f1'));
  if(preserve){for(const k in keep){const e=$(k);if(e&&(k!=='freeT'||k===aid))e.value=keep[k]}
    if(aid&&$(aid)){$(aid).focus();try{if(sel&&sel[0]!=null)$(aid).setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
let navDepth=0;
var navDir='';
function setApp(html){if(app.__html===html)return;app.innerHTML=html;app.__html=html;if(navDir){const f=app.firstElementChild;if(f){f.classList.add('enter-'+navDir)}}}
function go(v,fromPop){navDir=fromPop?'back':'fwd';if(!fromPop&&v!==view){history.pushState({v},'',v==='home'?location.pathname:'#'+v);navDepth++}
  if(v==='journal'&&!fromPop&&view!=='journal'){diaryDate=diaryJump||today();diaryJump=null;dq='';dAnim=''}
  view=v;memId=null;confirmDel=false;filterTag=null;newTagOpen=false;editId=null;app.__html='';render();navDir='';window.scrollTo(0,0)}
function goBack(fallback){if(navDepth>0)history.back();else go(fallback)}
addEventListener('popstate',e=>{navDepth=Math.max(0,navDepth-1);let v=(e.state&&e.state.v)||'home';if(v==='review'&&!review)v='dump';go(v,true)});

function home(){
  const notes=allNotes();
  const total=notes.reduce((a,n)=>a+(n.kind==='free'?0:S.notes[n.id].items.filter(i=>!i.ex).length),0);
  const up=upcoming();
  let results='';
  if(q.trim()){
    const ql=q.trim().toLowerCase(),hits=[];
    notes.forEach(n=>{const d=S.notes[n.id];
      if(n.kind==='free'){if(d.text.toLowerCase().includes(ql)){const i=d.text.toLowerCase().indexOf(ql);hits.push({n,t:(i>40?'…':'')+d.text.slice(Math.max(0,i-40),i+80)})}}
      else d.items.forEach(i=>{const hay=[i.t,i.tag,i.who].join(' ').toLowerCase();if(hay.includes(ql))hits.push({n,t:(i.who?i.who+': ':'')+i.t})})});
    Object.keys(S.diary||{}).sort().reverse().forEach(dd=>S.diary[dd].items.forEach(l=>{if(l.t&&l.t.toLowerCase().includes(ql))hits.push({n:{id:'journal',title:'Diary · '+dLong(dd)},t:l.t,date:dd})}));
    results=hits.length?`<ul class="results">${hits.slice(0,60).map(h=>`<li><button data-open="${h.n.id}"${h.date?` data-date="${h.date}"`:''}><div class="where">${esc(h.n.title)}</div><div>${hl(h.t,q.trim())}</div></button></li>`).join('')}</ul>`
      :`<p class="empty">Nothing matches “${esc(q.trim())}”.</p>`;
  }
  setApp(`
  <header class="hero">
    <button class="avatar" id="avBtn" type="button" aria-label="${S.photo?'Change your photo':'Add your photo'}">${S.photo?`<img src="${S.photo}" alt="">`:'<span>A</span><i>+</i>'}</button>
    <div class="hero-txt"><p class="hello">${greet()}, Alok</p><p class="date"><span>${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</span><span class="clock" id="clock" role="timer" aria-label="Current time"></span></p></div>
  </header>
  <div>
    <h1><b>Write it down.</b><span class="l2">Free your mind.</span></h1>
    <p class="thought">“${esc(thought())}”</p>
  </div>
  <div class="stats">
    <div><b>${total}</b><span>things saved</span></div>
    <div><b>${up.length}</b><span>coming up</span></div>
    <div><b>${S.notes.reset.items.filter(i=>i.done).length}/${S.notes.reset.items.length}</b><span>monthly reset</span></div>
  </div>
  <p class="syncline"><span id="syncEl" class="sync ${sync}">${esc(syncLabel())}</span></p>
  <form class="bar" id="cap"><input id="capIn" placeholder="Quick capture to Brain Dump…" autocomplete="off" aria-label="Quick capture"><button class="btn">Save</button></form>
  <div class="bar search"><span class="lbl">Search</span><input id="qIn" type="search" placeholder="Find anything in all notes" value="${esc(q)}" autocomplete="off" aria-label="Search all notes"></div>
  ${q.trim()?results:`
  ${(()=>{const ds=dSummary();return `<button class="dcard" data-open="journal" type="button"><span class="eyebrow">Diary · ${esc(new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'}))}</span><span class="dcard-t">${ds.first?esc(ds.first):'Begin today’s page'}</span><span class="dcard-m"><span>${esc(ds.meta)}</span><span class="dcard-go">Open diary →</span></span></button>`})()}
  ${up.length?`<section class="upcoming" aria-label="Coming up"><p class="eyebrow">Coming up</p><ul>${up.map(u=>`<li><button data-open="${u.go}" type="button"><span>${esc(u.t)}</span><span class="when ${u.soon?'soon':''}">${esc(u.w)}</span></button></li>`).join('')}</ul></section>`:''}
  <div>
  <ol class="index">${notes.map((n,i)=>{
    const d=S.notes[n.id];let c;
    if(n.kind==='free')c=d.text.trim()?d.text.trim().split(/\s+/).length+' words':'empty';
    else if(n.kind==='check')c=d.items.filter(x=>x.done).length+'/'+d.items.length+' done';
    else{const r=d.items.filter(x=>!x.ex).length;c=r+(r===1?' entry':' entries')}
    const al=n.id==='admin'&&up.some(u=>u.go==='admin'&&u.soon)?` <span class="alert">· ${up.filter(u=>u.go==='admin'&&u.soon).length} due within 30 days</span>`:'';
    return `<li><button data-open="${n.id}"><span class="n" style="color:${colorOf(n)}">${i+1}.</span><span class="t">${esc(n.title)}</span><span class="c">${c}</span><span class="h">${esc(n.hint)}${al}</span></button></li>`}).join('')}</ol>
  <form class="newnote" id="newF"><input id="newIn" placeholder="+ Create your own note" autocomplete="off" aria-label="New note title" maxlength="60"><button class="btn sm ghost">Create</button></form>
  </div>
  <p class="closing">The less time you spend trying to remember everything, the more time you have to enjoy your life.</p>`}
  <p class="credit">Crafted by Alok</p>`);
  $('cap').onsubmit=e=>{e.preventDefault();const v=$('capIn').value.trim();if(!v)return;
    S.notes.dump.items.unshift({id:uid(),t:v,tag:'Idea'});mark('dump');toast('Saved to Brain Dump');render();$('capIn').focus()};
  $('avBtn').onclick=()=>$('avIn').click();
  $('avIn').onchange=()=>{const f=$('avIn').files[0];$('avIn').value='';if(!f)return;const u=URL.createObjectURL(f);openCrop(u)};
  $('qIn').oninput=()=>{q=$('qIn').value;render(true)};
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(b.dataset.date)diaryJump=b.dataset.date;go(b.dataset.open)});
  if($('newF'))$('newF').onsubmit=e=>{e.preventDefault();const t=$('newIn').value.trim();if(!t)return;
    const id='c'+uid();S.custom.push({id,title:t});S.notes[id]={items:[],text:''};mark('meta',id);go(id)};
}

function starBtn(i){return `<button class="star ${i.pin?'on':''}" data-pin="${i.id}" aria-label="${i.pin?'Unpin':'Pin to top'}" aria-pressed="${!!i.pin}">${i.pin?'★':'☆'}</button>`}
function delBtn(i){return `<button class="x ed" data-edit="${i.id}" aria-label="Edit"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 20h4L19 9l-4-4L4 16v4ZM14 6l4 4"/></svg></button><button class="x" data-del="${i.id}" aria-label="Delete">×</button>`}
function exm(i){return i.ex?'<span class="exmark">e.g.</span>':''}

function sheet(){
  const notes=allNotes(),n=notes.find(x=>x.id===view),d=S.notes[n.id],idx=notes.indexOf(n)+1;
  const hasEx=d.items.some(i=>i.ex), lists=notes.filter(x=>x.kind==='list'&&x.id!=='dump');
  let form='',list='',tools='',chips='',typesRow='';
  const fil=i=>!filterTag||i.tag===filterTag;
  if(n.tags&&(n.kind==='list'||n.kind==='admin')){
    const cnt={};d.items.forEach(i=>{if(i.tag)cnt[i.tag]=(cnt[i.tag]||0)+1});
    const used=Object.keys(cnt);
    if(used.length>1||filterTag)chips=`<div class="chips" role="group" aria-label="Filter by type"><button class="chip ${!filterTag?'on':''}" data-f="" type="button">All <span>${d.items.length}</span></button>${used.map(t=>`<button class="chip ${filterTag===t?'on':''}" data-f="${esc(t)}" type="button">${esc(t)} <span>${cnt[t]}</span></button>`).join('')}</div>`;
    const own=(S.tags[n.id]||[]);
    if(own.length)typesRow=`<div class="chips"><span class="note">Your types:</span>${own.map(t=>`<span class="chip">${esc(t)}<button class="x" data-rmtag="${esc(t)}" aria-label="Remove type ${esc(t)}" type="button">×</button></span>`).join('')}</div>`;
  }
  if(n.kind==='list'){
    form=`<input class="grow" id="f1" placeholder="${esc(n.ph)}" autocomplete="off" aria-label="Entry">${tagSel(n)}<button class="btn">Add</button>`;
    list=d.items.length?`<ul class="items">${pinSort(d.items).filter(fil).map(i=>i.id===editId?editForm(n,i):`<li class="${i.ex?'ex':''}" data-swipe="${i.id}">${starBtn(i)}<div class="body">${exm(i)}${esc(i.t)}<div class="meta"><span class="tag">${esc(i.tag||'')}</span>${i.date?`<span>${fmt(i.date)}</span>`:''}</div></div>${n.id==='dump'&&!i.ex?`<select class="mv" data-mv="${i.id}" aria-label="Move to note"><option value="">Move…</option>${lists.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select>`:''}${delBtn(i)}</li>`).join('')}</ul>`:'';
    const real=d.items.filter(i=>!i.ex).length;
    if(n.id==='dump'&&real)tools=`<button class="btn sm" id="revB" type="button">Review & sort ${real} ${real===1?'item':'items'}</button>`;
    if(n.id==='smile'&&d.items.length)tools=`<button class="btn sm" id="memB" type="button">Show a random memory</button>`;
  }
  if(n.kind==='admin'){
    form=`<input class="grow" id="f1" placeholder="${esc(n.ph)}" autocomplete="off" aria-label="What">${tagSel(n)}<label class="d">Date <input type="date" id="f2"></label><select id="fR" aria-label="Repeats"><option value="">One time</option><option value="m">Every month</option><option value="y">Every year</option></select><button class="btn">Add</button>`;
    const it=[...d.items].filter(fil).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||((a.due||'9')<(b.due||'9')?-1:1));
    list=it.length?`<ul class="items">${it.map(i=>{if(i.id===editId)return editForm(n,i);const dl=i.due?daysLeft(i.due):null;return `<li class="${i.ex?'ex':''}" data-swipe="${i.id}">${starBtn(i)}<div class="body">${exm(i)}${esc(i.t)}<div class="meta">${i.tag?`<span class="tag">${esc(i.tag)}</span>`:''}${i.due?`<span>${fmt(i.due)}</span><span class="due ${dl<=30?'soon':'ok'}">${dueTxt(i.due)}</span>${i.rep?`<span class="tag">${REP[i.rep]}</span>`:''}${calLink(i.t,i.due,i.rep)}`:'<span>no date</span>'}</div>${i.rep&&i.due&&dl<=30&&!i.ex?`<button class="btn ghost sm renew" data-renew="${i.id}" type="button">Renewed · set next date</button>`:''}</div>${delBtn(i)}</li>`}).join('')}</ul>`:'';
  }
  if(n.kind==='people'){
    form=`<input id="f1" placeholder="Name" autocomplete="off" aria-label="Name" list="names" style="flex:1 1 110px"><datalist id="names">${[...new Set(d.items.map(i=>i.who))].map(w=>`<option value="${esc(w)}">`).join('')}</datalist><input class="grow" id="f2" placeholder="Coffee, book, goal…" autocomplete="off" aria-label="Detail"><label class="d">Birthday <input type="date" id="f3"></label><button class="btn">Add</button>`;
    const g={};pinSort(d.items).forEach(i=>(g[i.who]=g[i.who]||[]).push(i));
    const names=Object.keys(g).sort((a,b)=>(g[b].some(i=>i.pin)?1:0)-(g[a].some(i=>i.pin)?1:0)||a.localeCompare(b));
    list=names.map(w=>{const b=g[w].find(i=>i.bday);return `<div class="person"><h3>${esc(w)}${b?`<span class="meta"><span class="tag">Birthday · ${fmtMD(b.bday)} · in ${bdayIn(b.bday)} days</span>${calLink(w+'’s birthday',nextBday(b.bday),'y')}</span>`:''}</h3><ul>${g[w].map(i=>i.id===editId?editForm(n,i):`<li class="${i.ex?'ex':''}" data-swipe="${i.id}">${starBtn(i)}<span class="body">${exm(i)}${esc(i.t)}</span>${delBtn(i)}</li>`).join('')}</ul></div>`}).join('');
  }
  if(n.kind==='check'){
    form=`<input class="grow" id="f1" placeholder="${esc(n.ph)}" autocomplete="off" aria-label="Item"><button class="btn">Add</button>`;
    const dn=d.items.filter(i=>i.done).length,tt=d.items.length,pct=tt?Math.round(dn/tt*100):0;
    const have=new Set(d.items.map(i=>i.t.toLowerCase())),sug=RESET_SUGG.filter(x=>!have.has(x[0].toLowerCase()));
    const hist=Object.entries(d.history||{}).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,6);
    list=`<div class="rprog"><div class="rbar"><span style="width:${pct}%;background:${colorOf(n)}"></span></div><span class="note">${dn} of ${tt} done${tt&&dn===tt?' · all clear this month':''}</span></div>
    <ul class="items">${d.items.map(i=>i.id===editId?editForm(n,i):`<li class="${i.done?'done':''}" data-swipe="${i.id}"><input type="checkbox" class="chk" id="c${i.id}" data-chk="${i.id}" ${i.done?'checked':''}><label class="body" for="c${i.id}">${esc(i.t)}</label>${i.link?`<button class="btn ghost sm" data-go="${i.link}" type="button">Open</button>`:''}${delBtn(i)}</li>`).join('')}</ul>
    ${sug.length?`<div class="sugg"><p class="eyebrow">Suggestions · tap to add</p><div class="chips">${sug.map(x=>`<button class="chip" data-sug="${esc(x[0])}" type="button">+ ${esc(x[0])}</button>`).join('')}</div></div>`:''}
    ${hist.length?`<div class="hist"><p class="eyebrow">Past months</p><ul>${hist.map(([m,h])=>`<li><span>${new Date(m+'-01T00:00').toLocaleDateString('en-IN',{month:'short',year:'numeric'})}</span><span class="rbar"><span style="width:${h.total?h.done/h.total*100:0}%"></span></span><span class="note">${h.done}/${h.total}</span></li>`).join('')}</ul></div>`:''}`;
    tools=`<button class="btn ghost sm" id="uncheck" type="button">Start fresh this month</button><span class="note">Unchecks automatically on the 1st. Swipe left to remove an item.</span>`;
  }
  const mem=memId&&d.items.find(i=>i.id===memId);
  setApp(`<div class="sheet">
   <div class="top"><button class="back" id="back">← All notes</button><span class="pill" style="background:${colorOf(n)}">${idx}/${notes.length}</span></div>
   <div><h2><span style="color:${colorOf(n)}">${idx}.</span> ${esc(n.title)}</h2><p class="line">${n.line}</p>${n.id==='admin'?'<p class="note" style="margin-top:8px">For account numbers, store only the last 4 digits here.</p>':''}</div>
   ${n.kind==='free'?`<textarea class="free" id="freeT" aria-label="Empty note" placeholder="…">${esc(d.text)}</textarea>`:
   `${mem?`<div class="memory">${esc(mem.t)}<div class="meta"><span class="tag">${esc(mem.tag||'')}</span>${mem.date?`<span>${fmt(mem.date)}</span>`:''}</div></div>`:''}
   <form class="add" id="addF">${form}</form>
   ${typesRow}
   ${tools?`<div class="tools">${tools}</div>`:''}
   ${chips}
   <div>${list||'<p class="empty">Nothing here yet. Write the first one above.</p>'}</div>
   ${hasEx?'<div><button class="linkbtn" id="clrEx" type="button">Remove the examples</button></div>':''}`}
   ${n.custom?`<div class="tools">${confirmDel?`<span class="note">Delete “${esc(n.title)}” and all its entries?</span><button class="btn warn sm" id="delYes" type="button">Delete note</button><button class="btn ghost sm" id="delNo" type="button">Keep it</button>`:'<button class="linkbtn" id="delNote" type="button">Delete this note</button>'}</div>`:''}
  </div>`);
  $('back').onclick=()=>goBack('home');
  if(n.custom){
    if($('delNote'))$('delNote').onclick=()=>{confirmDel=true;render()};
    if($('delNo'))$('delNo').onclick=()=>{confirmDel=false;render()};
    if($('delYes'))$('delYes').onclick=()=>{S.custom=S.custom.filter(c=>c.id!==n.id);delete S.notes[n.id];mark('meta',n.id);toast('Note deleted');go('home')};
  }
  if(n.kind==='free'){let t;$('freeT').oninput=()=>{d.text=$('freeT').value;mark(n.id)};return}
  $('addF').onsubmit=e=>{e.preventDefault();const a=$('f1').value.trim(),b=$('f2')?$('f2').value.trim():'';
    let tag=null;
    if($('fT')){
      tag=$('fT').value;
      if(tag==='__new'){
        const nt=$('f4').value.trim().slice(0,24);if(!nt)return $('f4').focus();
        tag=tagsFor(n).find(t=>t.toLowerCase()===nt.toLowerCase());
        if(!tag){tag=nt;(S.tags[n.id]=S.tags[n.id]||[]).push(nt);mark('meta')}
        newTagOpen=false;selTag[n.id]=tag;
        if(!a){render();$('f1').focus();toast('Type “'+tag+'” added');return}
      }
      if(a)selTag[n.id]=tag;
    }
    if(n.kind==='people'){
      const bd=$('f3').value?$('f3').value.slice(5):null;
      if(!a)return $('f1').focus();if(!b&&!bd)return $('f2').focus();
      if(bd)d.items.forEach(i=>{if(i.who===a)i.bday=null});
      d.items.push({id:uid(),who:a,t:b||'Birthday',bday:bd});
    } else {
      if(!a)return;
      if(n.kind==='admin')d.items.push({id:uid(),t:a,due:b||null,tag,rep:b?($('fR').value||null):null});
      else if(n.kind==='check')d.items.push({id:uid(),t:a,done:false});
      else d.items.unshift({id:uid(),t:a,tag,date:n.dated?today():null});
    }
    mark(n.id);render();
    if(n.kind==='people'){$('f1').value=a;$('f2').focus()}else $('f1').focus()};
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delItem(n.id,b.dataset.del));
  app.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{const x=RESET_SUGG.find(s=>s[0]===b.dataset.sug);d.items.push({id:uid(),t:x[0],done:false,link:x[1]||null});mark(n.id);render();toast('Added to Monthly Reset')});
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const t=b.dataset.go;if(t==='review'){const r=S.notes.dump.items.filter(i=>!i.ex).map(i=>i.id);if(!r.length){toast('Brain Dump is already empty');return}review={ids:r,at:0,moved:0,deleted:0}}go(t)});
  if($('fT'))$('fT').onchange=()=>{const v=$('fT').value;
    if(v==='__new'){newTagOpen=true;render(true);$('f4').focus()}
    else{newTagOpen=false;selTag[n.id]=v;$('f4').hidden=true}};
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filterTag=b.dataset.f||null;render()});
  app.querySelectorAll('[data-rmtag]').forEach(b=>b.onclick=()=>{const t=b.dataset.rmtag;
    S.tags[n.id]=(S.tags[n.id]||[]).filter(x=>x!==t);if(selTag[n.id]===t)delete selTag[n.id];mark('meta');render();toast('Type “'+t+'” removed. Existing entries keep it.')});
  bindEdit(n,d);
  app.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{const it=d.items.find(x=>x.id===b.dataset.pin);it.pin=!it.pin;mark(n.id);render()});

var dActx=null;

function dFlipSound(){
  if(!dSoundOn())return;
  try{
    dActx=dActx||new (window.AudioContext||window.webkitAudioContext)();if(dActx.state==='suspended')dActx.resume();
    const a=dActx,t=a.currentTime+.01,dur=.55,sr=a.sampleRate,buf=a.createBuffer(1,Math.floor(sr*dur),sr),ch=buf.getChannelData(0);
    for(let i=0;i<ch.length;i++){const crackle=Math.random()<.035?(Math.random()*2-1):0;ch[i]=(Math.random()*2-1)*.45+crackle*.9}

    const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=350;
    const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.32,t+.05);g.gain.exponentialRampToValueAtTime(.08,t+.22);
    g.gain.exponentialRampToValueAtTime(.42,t+.36);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(bp);bp.connect(hp);hp.connect(g);g.connect(a.destination);src.start(t);src.stop(t+dur);
  }catch(e){}
}
